<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT 10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-image: url(https://i.pinimg.com/1200x/60/89/08/6089082cecce0f84dd31e887ed23336d.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }
        .checkerform {
            background-color: rgb(130, 163, 187);
            width: 700px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        #button {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            width: 250px;
            height: 30px;
            background-color: rgb(19, 56, 82);
            color: rgb(230, 230, 211);
            border: none;
            cursor: pointer;
            border-radius: 15px;
        }
        #output1 {
            background-color: #f4f6f9;
            margin-top: 10px;
            color: rgb(19, 56, 82);
            border-radius: 10px;
        }
        h1 {
            color: rgb(19, 56, 82);
            font-weight: bold;
            background-color: #f4f6f9;
            border-radius: 15px;
        }
        p {
            color: rgb(43, 92, 126);;
            font-weight: bold;
        }
        #label {
            color: rgb(19, 56, 82);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="checkerform">
        <h1>Non-Metal Elements</h1>
        <p>Enter a non-metal element's symbol to learn more about it</p>
        <label for="elements" id="label">Element Symbol</label>
        <br>
        <input type="text" id="elements" class="form-control" placeholder="Example: 'H'">
        <br>
        <button type="button" class="btn btn-primary" py-click="periodic" id="button">Check</button>
        <div id="output1"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
